name: 构建检查

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: 授予 Gradle Wrapper 执行权限
        run: chmod +x gradlew
      - name: 构建模组
        run: ./gradlew build --stacktrace
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: recipe-sender-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error