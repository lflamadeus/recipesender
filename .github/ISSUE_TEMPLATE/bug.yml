name: 错误报告
description: 报告可以稳定复现的功能异常
title: "[错误] "
labels: ["错误"]
body:
  - type: input
    id: version
    attributes:
      label: 模组版本
      placeholder: 例如 1.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请填写 Minecraft、Forge、EMI、FindMeExtended 和 Architectury API 版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或崩溃报告
      render: shell